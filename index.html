<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Планировщик</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Мой Дневник</span>
            </div>

            <button class="btn-primary" id="new-task-btn">
                <i class="fa-solid fa-plus"></i> Новое дело
            </button>

            <!-- Мини-календарь -->
            <div class="mini-calendar">
                <div class="mini-header">
                    <span id="mini-month-year"></span>
                    <div>
                        <button id="mini-prev"><i class="fa-solid fa-chevron-left"></i></button>
                        <button id="mini-next"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="mini-weekdays">
                    <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                </div>
                <div class="mini-grid" id="mini-grid"></div>
            </div>

            <!-- Фильтры по категориям -->
            <div class="categories-filter">
                <h4>Категории</h4>
                <label><input type="checkbox" class="cat-filter" value="work" checked> <span class="badge work">Работа</span></label>
                <label><input type="checkbox" class="cat-filter" value="personal" checked> <span class="badge personal">Личное</span></label>
                <label><input type="checkbox" class="cat-filter" value="study" checked> <span class="badge study">Учеба</span></label>
                <label><input type="checkbox" class="cat-filter" value="health" checked> <span class="badge health">Здоровье</span></label>
            </div>
        </aside>

        <!-- Основная часть -->
        <main class="main-content">
            <!-- Шапка планировщика -->
            <header class="top-header">
                <div class="date-navigation">
                    <button id="today-btn" class="btn-secondary">Сегодня</button>
                    <button id="prev-btn" class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="next-btn" class="icon-btn"><i class="fa-solid fa-chevron-right"></i></button>
                    <h2 id="current-date-title">9 октября 2026</h2>
                </div>

                <div class="view-switcher">
                    <button class="view-btn active" data-view="day">День</button>
                    <button class="view-btn" data-view="week">Неделя</button>
                    <button class="view-btn" data-view="month">Месяц</button>
                </div>
            </header>

            <!-- Контейнер для отображения расписания (день, неделя или месяц) -->
            <div class="schedule-container" id="schedule-container">
                <!-- Сюда JavaScript будет динамически вставлять сетку часов -->
            </div>
        </main>
    </div>

    <!-- Модальное окно добавления / редактирования дела -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Добавить событие</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="event-form">
                <input type="hidden" id="event-id">
                
                <div class="form-group">
                    <label>Название дела</label>
                    <input type="text" id="event-title" required placeholder="Например: Встреча с клиентом">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Дата</label>
                        <input type="date" id="event-date" required>
                    </div>
                    <div class="form-group">
                        <label>Час</label>
                        <select id="event-hour">
                            <!-- Заполняется JS с 00 до 23 -->
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Категория</label>
                        <select id="event-category">
                            <option value="work">Работа</option>
                            <option value="personal">Личное</option>
                            <option value="study">Учеба</option>
                            <option value="health">Здоровье</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Заметка / Описание</label>
                    <textarea id="event-desc" rows="3" placeholder="Дополнительные детали..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-danger" id="delete-event-btn" style="display: none;">Удалить</button>
                    <button type="submit" class="btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Подключаем логику -->
    <script src="script.js"></script>
</body>
</html>
